name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Typecheck, unit tests, build
        run: bun run check

      - name: Tag matches package version
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./dist/future-clock/package.json').version")"
          if [ "v$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v$pkg" >&2
            exit 1
          fi

      - name: Publish (OIDC trusted publishing, provenance is automatic)
        run: npm publish ./dist/future-clock --access public
